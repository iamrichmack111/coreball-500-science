<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coreball 500 Science</title>
<style>
:root{
  --bg:#1f1d2d;
  --core:#242636;
  --pink:#ff5da9;
  --pink-soft:#ff8fc2;
  --text:#f8f5fb;
  --muted:#aaa7b8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{width:min(610px,100%);margin:auto;padding:8px 10px 16px}
.top{height:44px;display:flex;justify-content:space-between;align-items:center}
.level{font-weight:900;font-size:15px}
.hearts{font-size:17px;color:#ff7690;letter-spacing:2px}
.stage{position:relative;width:100%;aspect-ratio:1/1.04;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.toast{
 position:absolute;left:50%;top:11px;transform:translateX(-50%);
 opacity:0;pointer-events:none;background:rgba(10,9,18,.9);
 border:1px solid rgba(255,255,255,.12);border-radius:8px;
 padding:6px 9px;font-size:10px;font-weight:900
}
.toast.on{animation:pop .18s ease-out}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.9)}35%{opacity:1;transform:translateX(-50%) scale(1.03)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr .65fr .65fr;gap:6px;margin-top:6px}
button{
 min-height:40px;border:1px solid rgba(255,255,255,.13);border-radius:8px;
 background:#29273a;color:#fff;font-weight:900;padding:6px 8px;cursor:pointer;
 -webkit-tap-highlight-color:transparent
}
button:disabled{opacity:.35;cursor:not-allowed}
button:active{transform:translateY(1px)}
.fire{background:var(--pink);border-color:var(--pink);color:#281622}
.slow{color:#dff8ff}
.status{min-height:16px;text-align:center;color:var(--muted);font-size:10px;margin-top:5px}
.meta{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:9px}
.meta b{color:#eee}
.lifeBtn{min-height:29px;padding:3px 7px;font-size:9px}
.quizBack{
 position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
 padding:18px;background:rgba(18,16,28,.94)
}
.quizBack.open{display:flex}
.quiz{
 width:min(420px,100%);background:#282638;border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:15px
}
.quiz .tag{font-size:9px;color:var(--pink-soft);font-weight:900;letter-spacing:.12em;margin-bottom:7px}
.quiz h2{font-size:17px;line-height:1.25;margin:0 0 11px}
.answers{display:grid;gap:6px}
.answer{text-align:left;background:#333044;min-height:40px}
.answer.correct{background:#163d2a;border-color:#58d190}
.answer.wrong{background:#4a1d2a;border-color:#ff738c}
.result{min-height:18px;margin-top:8px;font-size:10px;color:#ccc}
.continue{width:100%;margin-top:7px;display:none}
.continue.show{display:block}
@media(max-width:520px){
 .app{padding:5px 6px 12px}.top{height:40px}
 .controls{grid-template-columns:1fr 1fr}.fire{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="level">LEVEL <span id="level">1</span></div>
    <div class="hearts" id="hearts">♥ ♥ ♥</div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="600" height="625"></canvas>
    <div id="toast" class="toast"></div>

    <div id="quizBack" class="quizBack" role="dialog" aria-modal="true">
      <div class="quiz">
        <div class="tag">SCIENCE SAVE · +1 HEART</div>
        <h2 id="question"></h2>
        <div id="answers" class="answers"></div>
        <div id="result" class="result"></div>
        <button id="continueBtn" class="continue" type="button">CONTINUE</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="fire" class="fire" type="button">FIRE</button>
    <button id="slow" class="slow" type="button">SLOW 50% ×<span id="slowCount">3</span></button>
    <button id="deep" class="slow" type="button">SLOW 25% ×2</button>
    <button id="pause" type="button">Ⅱ</button>
    <button id="retry" type="button">↻</button>
  </div>

  <div id="status" class="status">Tap the board, FIRE, or Space to launch.</div>

  <div class="meta">
    <span><b id="placed">4</b>/<b id="total">10</b> attached</span>
    <span>Pattern <b id="pattern">OPEN</b></span>
    <span>Question after a lost heart = chance to restore it</span>
    <button id="lifeBtn" class="lifeBtn" type="button">3 / 5 / 7 HEARTS</button>
  </div>
</div>

const QUESTIONS=[{"q":"Which planet is known as the Red Planet?","a":["Venus","Mars","Jupiter","Mercury"],"c":1},{"q":"What gas do plants take in during photosynthesis?","a":["Oxygen","Nitrogen","Carbon dioxide","Helium"],"c":2},{"q":"What is H\u2082O?","a":["Salt","Water","Hydrogen peroxide","Oxygen"],"c":1},{"q":"Which organ pumps blood through the body?","a":["Brain","Lungs","Heart","Liver"],"c":2},{"q":"What force pulls objects toward Earth?","a":["Friction","Gravity","Magnetism","Electricity"],"c":1},{"q":"What is the largest planet in our solar system?","a":["Earth","Saturn","Jupiter","Neptune"],"c":2},{"q":"Which state of matter has a fixed shape and volume?","a":["Gas","Liquid","Plasma","Solid"],"c":3},{"q":"Which part of a plant usually absorbs water from soil?","a":["Flower","Roots","Fruit","Leaves"],"c":1},{"q":"What is the center of an atom called?","a":["Nucleus","Orbit","Cell","Proton"],"c":0},{"q":"Which blood cells help fight infection?","a":["Red blood cells","White blood cells","Platelets","Plasma"],"c":1},{"q":"Which simple machine is a ramp?","a":["Lever","Pulley","Inclined plane","Wheel and axle"],"c":2},{"q":"Which layer of Earth do we live on?","a":["Core","Mantle","Crust","Outer core"],"c":2},{"q":"What type of energy is stored in food?","a":["Chemical","Sound","Light","Nuclear"],"c":0},{"q":"Which process changes liquid water into water vapor?","a":["Freezing","Condensation","Evaporation","Melting"],"c":2},{"q":"What do we call animals that eat only plants?","a":["Carnivores","Herbivores","Omnivores","Decomposers"],"c":1},{"q":"What is the nearest star to Earth?","a":["Sirius","Polaris","The Sun","Alpha Centauri"],"c":2},{"q":"Which organ helps you breathe?","a":["Kidneys","Lungs","Stomach","Pancreas"],"c":1},{"q":"What is the boiling point of water at sea level in Celsius?","a":["0\u00b0C","50\u00b0C","100\u00b0C","212\u00b0C"],"c":2},{"q":"Which of these is a conductor of electricity?","a":["Rubber","Copper","Plastic","Glass"],"c":1},{"q": const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');

const W=600,H=625,TAU=Math.PI*2;
const CX=300,CY=210;
const CORE_R=50;
const ORBIT=125;
const BALL_R=12;
const QUEUE_Y=410;
const IMPACT_Y=CY+ORBIT;
const COLLIDE=BALL_R*2-1;

const G={
 level:1,lives:3,maxLives:3,slowCharges:3,
 angle:0,dir:1,omega:0,reverseClock:0,
 slowUntil:0,slowFactor:1,
 attached:[],starterCount:0,queue:[],
 flight:null,impact:null,
 paused:false,quizOpen:false,quiz:null,
 last:performance.now(),completed:false,
 collisions:0
};

function spec(){return LEVELS[G.level-1]}
function norm(a){return ((a%TAU)+TAU)%TAU}
function corePos(rel){const a=rel+G.angle;return{x:CX+Math.cos(a)*CORE_R,y:CY+Math.sin(a)*CORE_R}}
function ballPos(rel){const a=rel+G.angle;return{x:CX+Math.cos(a)*ORBIT,y:CY+Math.sin(a)*ORBIT}}

function loadLevel(){
 const s=spec();
 G.angle=0;G.dir=s.dir;G.omega=s.omega;G.reverseClock=0;
 G.attached=s.starters.slice();G.starterCount=s.starters.length;
 G.queue=Array.from({length:s.shots},(_,i)=>s.shots-i);
 G.flight=null;G.impact=null;G.paused=false;G.completed=false;
 G.slowUntil=0;G.slowFactor=1;
 updateHud();draw(performance.now());
}

function updateHud(){
 const s=spec();
 $('level').textContent=G.level;
 $('hearts').textContent=Array.from({length:G.maxLives},(_,i)=>i<G.lives?'♥':'♡').join(' ');
 $('placed').textContent=G.attached.length;
 $('total').textContent=s.total;
 $('pattern').textContent=s.pattern;
 $('slowCount').textContent=G.slowCharges;
 $('fire').disabled=G.paused||G.quizOpen||G.completed||!!G.flight||!!G.impact||!G.queue.length;
 $('slow').disabled=G.paused||G.quizOpen||G.completed||!!G.impact||G.slowCharges<1;
 $('deep').disabled=G.paused||G.quizOpen||G.completed||!!G.impact||G.slowCharges<2;
 $('pause').textContent=G.paused?'▶':'Ⅱ';
}

function toast(text){
 const e=$('toast');
 e.classList.remove('on');void e.offsetWidth;
 e.textContent=text;e.classList.add('on');
}

function startShot(){
 if(G.paused||G.quizOpen||G.completed||G.flight||G.impact||!G.queue.length)return false;
 G.flight={elapsed:0,duration:spec().flight_ms,number:G.queue[G.queue.length-1],y:QUEUE_Y};
 updateHud();return true;
}

function sweptHit(y0,y1){
 let best=null;
 for(const rel of G.attached){
   const p=ballPos(rel);
   const dx=p.x-CX;
   if(Math.abs(dx)>=COLLIDE)continue;
   const v=Math.sqrt(Math.max(0,COLLIDE*COLLIDE-dx*dx));
   const contact=p.y+v;
   if(y0>=contact&&y1<=contact){
     if(!best||contact>best.y)best={p,y:contact};
   }
 }
 return best;
}

function beginImpact(hit){
 const n=G.flight?G.flight.number:G.queue[G.queue.length-1];
 G.flight=null;
 G.lives=Math.max(0,G.lives-1);
 G.collisions++;
 G.impact={elapsed:0,duration:90,x:CX,y:hit.y,n,contactX:hit.p.x,contactY:hit.p.y};
 toast('HIT');
 $('status').textContent='Heart lost — answer science to win it back.';
 updateHud();
}

function finishImpact(){
 G.impact=null;
 openScienceQuiz();
}

function landingHit(){
 for(const rel of G.attached){
   const p=ballPos(rel);
   const dx=p.x-CX,dy=p.y-IMPACT_Y;
   if(dx*dx+dy*dy<=COLLIDE*COLLIDE)return {p,y:IMPACT_Y};
 }
 return null;
}

function landShot(){
 const hit=landingHit();
 if(hit){beginImpact(hit);return}

 const rel=norm(Math.PI/2-G.angle);
 G.attached.push(rel);
 G.queue.pop();
 G.flight=null;
 toast('✓');

 if(!G.queue.length){
   const done=G.level;
   if(done>=500){
     G.completed=true;
     $('status').textContent='All 500 levels complete!';
     toast('500 COMPLETE');
     updateHud();
     return;
   }
   if(done%5===0)G.slowCharges=Math.min(5,G.slowCharges+1);
   if(done%10===0)G.lives=Math.min(G.maxLives,G.lives+1);
   G.level++;
   loadLevel();
   $('status').textContent='Level '+G.level+'.';
 }else{
   $('status').textContent=G.queue.length+' balls left.';
   updateHud();
 }
}

function openScienceQuiz(){
 G.quizOpen=true;G.paused=true;
 const idx=(G.level*7+G.collisions*13+G.lives*3)%QUESTIONS.length;
 G.quiz={...QUESTIONS[idx],answered:false};
 $('question').textContent=G.quiz.q;
 $('result').textContent='';
 $('continueBtn').classList.remove('show');
 const box=$('answers');box.innerHTML='';
 G.quiz.a.forEach((text,i)=>{
   const b=document.createElement('button');
   b.className='answer';b.type='button';b.textContent=text;
   b.addEventListener('pointerdown',e=>{e.preventDefault();answerScience(i,b)},{passive:false});
   box.appendChild(b);
 });
 $('quizBack').classList.add('open');
 updateHud();
}

function answerScience(i,btn){
 if(!G.quizOpen||!G.quiz||G.quiz.answered)return;
 G.quiz.answered=true;
 const buttons=[...$('answers').children];
 buttons.forEach((b,j)=>{
   b.disabled=true;
   if(j===G.quiz.c)b.classList.add('correct');
 });
 if(i===G.quiz.c){
   G.lives=Math.min(G.maxLives,G.lives+1);
   $('result').textContent='Correct! Your lost heart is restored.';
   toast('+1 HEART');
 }else{
   btn.classList.add('wrong');
   $('result').textContent='Incorrect. Correct answer: '+G.quiz.a[G.quiz.c]+'.';
 }
 $('continueBtn').classList.add('show');
 updateHud();
}

function closeScience(){
 if(!G.quiz||!G.quiz.answered)return;
 G.quizOpen=false;
 $('quizBack').classList.remove('open');
 if(G.lives<=0){
   G.lives=G.maxLives;
   $('status').textContent='Out of hearts — lives reset. Retry the level.';
 }
 G.paused=false;
 loadLevel();
 updateHud();
}

function useSlow(factor,cost,label){
 if(G.paused||G.quizOpen||G.completed||G.impact||G.slowCharges<cost)return;
 G.slowCharges-=cost;
 G.slowFactor=factor;
 G.slowUntil=performance.now()+3600;
 toast(label);updateHud();
}

function togglePause(){
 if(G.quizOpen||G.impact||G.completed)return;
 G.paused=!G.paused;G.last=performance.now();updateHud();
}
function retry(){
 if(G.quizOpen||G.impact)return;
 if(G.lives<=0)G.lives=G.maxLives;
 G.paused=false;loadLevel();$('status').textContent='Level reset.';
}
function cycleLives(){
 if(G.quizOpen||G.impact)return;
 G.maxLives=G.maxLives===3?5:G.maxLives===5?7:3;
 G.lives=G.maxLives;toast(G.maxLives+' HEARTS');updateHud();
}

function circle(x,y,r,fill){
 ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill();
}
function drawPin(rel){
 const a=corePos(rel),b=ballPos(rel);
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
 ctx.strokeStyle='#ff7db8';ctx.lineWidth=1.7;ctx.stroke();
 circle(b.x,b.y,BALL_R,'#ff5da9');
}
function drawCore(){
 ctx.save();
 ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;
 circle(CX,CY,CORE_R,'#242636');ctx.restore();
 ctx.fillStyle='#d9d6e5';ctx.font='700 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(String(G.level),CX,CY);
}
function drawQueue(){
 const n=G.queue.length,max=Math.min(8,n),gap=25;
 for(let i=0;i<max;i++){
   if((G.flight||G.impact)&&i===0)continue;
   const num=G.queue[n-1-i],y=QUEUE_Y+i*gap;
   circle(CX,y,11,'#ff5da9');
   ctx.fillStyle='#fff';ctx.font='700 9px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText(String(num),CX,y+.5);
 }
}
function drawFlight(){
 if(!G.flight)return;
 const y=G.flight.y;
 ctx.beginPath();ctx.moveTo(CX,y+22);ctx.lineTo(CX,y+BALL_R-1);
 ctx.strokeStyle='#ff7db8';ctx.lineWidth=1.7;ctx.stroke();
 circle(CX,y,BALL_R,'#ff5da9');
 ctx.fillStyle='#fff';ctx.font='700 9px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(String(G.flight.number),CX,y+.5);
}
function drawImpact(){
 if(!G.impact)return;
 const i=G.impact,t=Math.min(1,i.elapsed/i.duration);
 ctx.save();
 ctx.globalAlpha=1-t*.5;
 circle(CX,i.y,BALL_R,'#ff5da9');
 ctx.restore();
}
function draw(now){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#1f1d2d';ctx.fillRect(0,0,W,H);
 G.attached.forEach(drawPin);
 drawCore();drawQueue();drawFlight();drawImpact();

 if(now<G.slowUntil){
   ctx.fillStyle='#9fb9c8';ctx.font='700 9px Arial';ctx.textAlign='center';
   ctx.fillText(G.slowFactor===.25?'SLOW 25%':'SLOW 50%',CX,20);
 }
 if(G.paused&&!G.quizOpen&&!G.impact){
   ctx.fillStyle='rgba(31,29,45,.72)';ctx.fillRect(0,0,W,H);
   ctx.fillStyle='#fff';ctx.font='700 26px Arial';ctx.textAlign='center';
   ctx.fillText('PAUSED',CX,H/2);
 }
}

function physicsStep(ms,now){
 if(G.paused||G.quizOpen||G.completed)return;

 if(G.impact){
   G.impact.elapsed+=ms;
   if(G.impact.elapsed>=G.impact.duration)finishImpact();
   return;
 }

 const s=spec();
 if(s.reverse_ms){
   G.reverseClock+=ms;
   if(G.reverseClock>=s.reverse_ms){
     G.reverseClock-=s.reverse_ms;G.dir*=-1;
   }
 }

 let omega=G.omega;
 if(now<G.slowUntil)omega*=G.slowFactor;
 G.angle=norm(G.angle+omega*G.dir*ms);

 if(G.flight){
   const y0=G.flight.y;
   G.flight.elapsed+=ms;
   const t=Math.min(1,G.flight.elapsed/G.flight.duration);
   const y1=QUEUE_Y+(IMPACT_Y-QUEUE_Y)*t;
   const hit=sweptHit(y0,y1);
   if(hit){
     G.flight.y=hit.y;beginImpact(hit);return;
   }
   G.flight.y=y1;
   if(t>=1)landShot();
 }
}

function update(now,dt){
 if(G.paused||G.quizOpen||G.completed)return;
 let remain=Math.min(45,dt);
 while(remain>0){
   const step=Math.min(2,remain);
   physicsStep(step,now-remain+step);
   remain-=step;
 }
}

function loop(now){
 const dt=Math.max(0,now-G.last);
 G.last=now;
 update(now,dt);
 draw(now);
 requestAnimationFrame(loop);
}

$('stage').addEventListener('pointerdown',e=>{e.preventDefault();startShot()},{passive:false});
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();startShot()},{passive:false});
$('slow').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();useSlow(.5,1,'SLOW 50%')},{passive:false});
$('deep').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();useSlow(.25,2,'SLOW 25%')},{passive:false});
$('pause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();togglePause()},{passive:false});
$('retry').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();retry()},{passive:false});
$('lifeBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();cycleLives()},{passive:false});
$('continueBtn').addEventListener('pointerdown',e=>{e.preventDefault();closeScience()},{passive:false});

window.addEventListener('keydown',e=>{
 if(e.repeat||G.quizOpen)return;
 if(e.code==='Space'||e.key==='Enter'){e.preventDefault();startShot()}
 else if(e.key.toLowerCase()==='s')useSlow(.5,1,'SLOW 50%');
 else if(e.key.toLowerCase()==='f')useSlow(.25,2,'SLOW 25%');
 else if(e.key.toLowerCase()==='p')togglePause();
 else if(e.key.toLowerCase()==='r')retry();
});

// Test helpers used for browser validation.
window.__TEST__={
 state:G,spec,startShot,update,draw,
 safeShot(){
   if(G.flight||G.impact||G.quizOpen||!G.queue.length)return false;
   const arr=G.attached.slice().sort((a,b)=>a-b);
   let best=-1,mid=0;
   for(let i=0;i<arr.length;i++){
     const a=arr[i],b=i===arr.length-1?arr[0]+TAU:arr[i+1];
     const gap=b-a;
     if(gap>best){best=gap;mid=norm(a+gap/2)}
   }
   const duration=spec().flight_ms;
   G.angle=norm(Math.PI/2-mid-G.omega*G.dir*duration);
   draw(performance.now());
   return startShot();
 },
 forceCrash(){
   if(G.flight||G.impact||G.quizOpen||!G.attached.length)return false;
   const rel=G.attached[0],duration=spec().flight_ms;
   G.angle=norm(Math.PI/2-rel-G.omega*G.dir*duration);
   draw(performance.now());
   return startShot();
 },
 answerCorrect(){
   if(!G.quizOpen||!G.quiz)return false;
   const b=$('answers').children[G.quiz.c];
   answerScience(G.quiz.c,b);return true;
 },
 closeScience
};

loadLevel();
requestAnimationFrame(loop);
})();
</script>
