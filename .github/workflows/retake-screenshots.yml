name: Retake Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/screenshots.spec.js'
      - '.github/workflows/retake-screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Retake screenshots
        run: npm run screenshots

      - name: Verify screenshot count
        run: |
          COUNT=$(find media/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "Generated $COUNT screenshots"
          test "$COUNT" -ge 16

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already current."
          else
            git commit -m "docs: retake V20 Playwright screenshots [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload screenshot gallery
        uses: actions/upload-artifact@v4
        with:
          name: coreball-v20-screenshots
          path: media/screenshots/*.png
          if-no-files-found: error
